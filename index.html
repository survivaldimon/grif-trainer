<!-- Аккаунт (необязательный): вход через Supabase и синхронизация настроек grif.* между устройствами.
     Без url/key ничего не грузится и строка в настройках скрыта. Ключ — публичный anon/publishable, не секретный. Схема БД — docs/supabase.sql. -->
<script>window.RIFFGYM_SUPABASE={url:'https://ixispdikcquoinknyoxh.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4aXNwZGlrY3F1b2lua255b3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNzMzNzMsImV4cCI6MjExMDc0OTM3M30.mGdonlevPjLwwB3Fgr_pcLRvA5Vu1AihMNCj-fQLQ4w'};</script>
<script>
(function(){
'use strict';
const CFG=window.RIFFGYM_SUPABASE||{},S=window.__grifStore,row=document.getElementById('accRow'),box=document.getElementById('accBox');
if(!CFG.url||!CFG.key||!S||!row||location.protocol==='file:')return; // file:// — тесты и локальный просмотр без сети
row.hidden=false;window.dispatchEvent(new Event('grif:acc'));
const ru=()=>document.documentElement.lang==='ru',T=(r,e)=>ru()?r:e;
const escH=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb=null,user=null,state='',timer=null,form=false;
function render(){
  document.getElementById('accLbl').textContent=T('Аккаунт','Account');
  if(!sb){box.innerHTML='<span class="acc-st">'+T('Загрузка…','Loading…')+'</span>';return;}
  if(user){box.innerHTML='<span class="acc-me">'+escH(user.email||'')+'</span><span class="acc-st">'+escH(state)+'</span><button class="btn" id="accOut" type="button">'+T('Выйти','Sign out')+'</button>';return;}
  if(!form){box.innerHTML='<button class="btn" id="accIn" type="button">'+T('Войти','Sign in')+'</button><span class="acc-st">'+T('Синхронизация настроек между устройствами','Sync settings across devices')+'</span>';return;}
  box.innerHTML='<form id="accForm" class="acc-form"><input type="email" id="accEmail" required autocomplete="email" placeholder="'+T('Эл. почта','Email')+'">'+
    '<button class="btn primary" type="submit">'+T('Прислать ссылку','Email me a link')+'</button>'+
    '<button class="btn" id="accGoogle" type="button">Google</button><button class="btn" id="accCancel" type="button">'+T('Отмена','Cancel')+'</button></form>'+
    '<span class="acc-st">'+escH(state)+'</span>';
}
const back=()=>location.origin+location.pathname;
box.addEventListener('click',async e=>{
  const id=e.target.id;
  if(id==='accIn'){form=true;state='';render();const i=document.getElementById('accEmail');i&&i.focus();}
  else if(id==='accCancel'){form=false;state='';render();}
  else if(id==='accGoogle'){const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:back()}});if(r.error){state=r.error.message;render();}}
  else if(id==='accOut'){await sb.auth.signOut();user=null;S.user=null;form=false;state='';render();window.dispatchEvent(new Event('grif:user'));}
});
box.addEventListener('submit',async e=>{
  e.preventDefault();const em=document.getElementById('accEmail').value.trim();if(!em)return;
  state=T('Отправляем…','Sending…');render();
  const r=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:back()}});
  state=r.error?r.error.message:T('Ссылка для входа отправлена на ','Sign-in link sent to ')+em;render();
});
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
// синхронизация: одна строка на пользователя, побеждает более позднее изменение
async function push(){
  if(!user)return;
  const r=await sb.from('user_settings').upsert({user_id:user.id,data:S.all(),updated_at:S.at()||Date.now()});
  state=r.error?T('Ошибка синхронизации','Sync error'):T('Синхронизировано','Synced');render();
}
async function pull(){
  const r=await sb.from('user_settings').select('data,updated_at').eq('user_id',user.id).maybeSingle();
  if(r.error){state=T('Ошибка синхронизации','Sync error');render();return;}
  const rem=r.data;
  if(rem&&+rem.updated_at>S.at()){
    if(JSON.stringify(rem.data)!==JSON.stringify(S.all())){S.put(rem.data,+rem.updated_at);location.reload();return;}
    S.put({},+rem.updated_at);
  }
  if(!rem||+rem.updated_at<S.at())await push();else{state=T('Синхронизировано','Synced');render();}
}
window.addEventListener('grif:ls',()=>{if(!user)return;clearTimeout(timer);timer=setTimeout(push,2000);});
// учёт занятий: очередь grif.logq уходит в practice_log и practice_sessions; client_id не даёт записать дважды
let lt=null,sending=false;
async function sendLog(){
  if(!user||sending||!S.logq)return;const q=S.logq();if(!q)return;
  const mine=a=>(Array.isArray(a)?a:[]).filter(x=>x&&x._u===user.id),strip=a=>a.map(x=>{const r=Object.assign({},x);delete r._u;return r;});
  const a=mine(q.log),b=mine(q.ses);if(!a.length&&!b.length)return;
  sending=true;const ok=new Set();
  try{
    if(a.length){const r=await sb.from('practice_log').upsert(strip(a),{onConflict:'user_id,client_id',ignoreDuplicates:true});if(!r.error)a.forEach(x=>ok.add(x.client_id));}
    if(b.length){const r=await sb.from('practice_sessions').upsert(strip(b),{onConflict:'user_id,client_id',ignoreDuplicates:true});if(!r.error)b.forEach(x=>ok.add(x.client_id));}
  }catch(e){}
  const cur=S.logq()||{};S.setLogq({log:(cur.log||[]).filter(x=>!ok.has(x.client_id)),ses:(cur.ses||[]).filter(x=>!ok.has(x.client_id))});
  sending=false;
}
// экран «Прогресс»: журнал с даты from (YYYY-MM-DD), постранично по 1000 строк
S.fetchLog=async from=>{
  if(!user)return null;let out=[];
  for(let i=0;i<20000;i+=1000){
    const r=await sb.from('practice_log').select('client_id,day,day_index,genre,inst,kind,ex_id,grp,planned_sec,played_sec,bpm,plan_min,clean_bpm').gte('day',from).order('day').order('id').range(i,i+999);
    if(r.error)throw r.error;out=out.concat(r.data||[]);if(!r.data||r.data.length<1000)break;
  }
  return out;
};
window.addEventListener('grif:log',()=>{clearTimeout(lt);lt=setTimeout(sendLog,1500);});
window.addEventListener('online',()=>{sendLog();});
render();
const sc=document.createElement('script');
sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
sc.onload=()=>{
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
  sb.auth.onAuthStateChange((ev,ses)=>{
    const was=user&&user.id;user=ses?ses.user:null;S.user=user?user.id:null;
    if(new URLSearchParams(location.search).has('code'))history.replaceState(null,'',location.pathname+location.hash);
    if(user&&user.id!==was){form=false;pull();sendLog();}
    if((user&&user.id)!==was)window.dispatchEvent(new Event('grif:user'));
    render();
  });
};
sc.onerror=()=>{row.hidden=true;};
document.head.appendChild(sc);
})();
</script>
