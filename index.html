<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гриф · Grif</title>
<meta name="description" content="Гриф — ежедневная тренировка на электрогитаре для техничного дэт-метала. Одна программа для всех, подстройка под время от 15 минут до 5 часов.">
<meta property="og:title" content="Гриф · Grif">
<meta property="og:description" content="Daily technical death metal guitar workout · Ежедневная тренировка техничного дэт-метала">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0e1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230e1115'/%3E%3Cg stroke='%2386c3e6' stroke-width='3'%3E%3Cpath d='M22 10v44M42 10v44'/%3E%3C/g%3E%3Cg stroke='%23e8e4da' stroke-width='2'%3E%3Cpath d='M6 16h52M6 23h52M6 30h52M6 37h52M6 44h52M6 51h52'/%3E%3C/g%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Sofia+Sans+Extra+Condensed:wght@700;800&display=swap">
<style>
/* Layout: шапка дня (дата, фаза, фокус) и выбор времени → две колонки: «Сейчас» (таймер, протокол, таб, метроном) и план сессии; на телефоне «Сейчас» сверху */
:root{
  --bg:#0e1115; --surface:#161a20; --surface-2:#1d222a; --line:#2a313b;
  --fg:#e8e4da; --muted:#8e96a2; --accent:#86c3e6; --accent-ink:#0b0e12;
  --k-warm:#d9a07e; --k-base:#86c3e6; --k-focus:#e2b45a; --k-maint:#a3adbb;
  --k-combo:#c39cf0; --k-music:#7fcc9c; --k-pause:#6b7482; --k-test:#ee7b66;
  --danger:#ee7b66;
  --f-display:"Sofia Sans Extra Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eeede9; --surface:#ffffff; --surface-2:#f6f5f1; --line:#d7d4cc;
    --fg:#15181d; --muted:#5b616b; --accent:#1c6890; --accent-ink:#ffffff;
    --k-warm:#9b5a35; --k-base:#1c6890; --k-focus:#946508; --k-maint:#5d6979;
    --k-combo:#7748b4; --k-music:#2b7c4d; --k-pause:#878e99; --k-test:#b5412c;
    --danger:#b5412c; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eeede9; --surface:#ffffff; --surface-2:#f6f5f1; --line:#d7d4cc;
  --fg:#15181d; --muted:#5b616b; --accent:#1c6890; --accent-ink:#ffffff;
  --k-warm:#9b5a35; --k-base:#1c6890; --k-focus:#946508; --k-maint:#5d6979;
  --k-combo:#7748b4; --k-music:#2b7c4d; --k-pause:#878e99; --k-test:#b5412c;
  --danger:#b5412c; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}

.hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,9vw,84px);line-height:.82;letter-spacing:.02em;text-transform:uppercase}
.logo b{color:var(--accent);font-weight:800}
.tag{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{background:var(--surface);border:1px solid var(--line);border-radius:6px;height:36px;min-width:36px;padding:0 10px}
.daynav button:hover{border-color:var(--muted)}
#dateLabel{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;min-width:9ch;text-align:center;text-transform:uppercase}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;height:36px}
.lang button{border:0;background:var(--surface);padding:0 10px;font-family:var(--f-mono);font-size:13px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}

.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip span{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.notice{border:1px dashed var(--accent);border-radius:8px;padding:10px 14px;font-size:14px;max-width:80ch}

.timebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.tchips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

.cal{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:12px}
.strip{display:grid;gap:4px}
.week{grid-template-columns:repeat(7,minmax(0,1fr))}
.cycle{grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);min-width:0}
.cell .d{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cell .v{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cycle .v{white-space:normal}
.cell .short{display:none}
.cell.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.t .v{color:var(--k-test)}

.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.now{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:14px}
.nowhd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.kind::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--kc,var(--muted))}
h2.title{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4vw,40px);line-height:.95;margin:0;text-wrap:balance;letter-spacing:.01em}
.clockrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-weight:600;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.bar{flex:1;min-width:120px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--kc,var(--accent))}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:8px 14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;min-width:96px}
.total{font-size:12px;color:var(--muted);font-family:var(--f-mono);margin-left:auto;align-self:center}

.sect h4{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sect p{margin:0 0 6px;max-width:68ch}
.sect ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:68ch}
.goal{font-weight:600}
.note{border-left:2px solid var(--kc,var(--accent));padding-left:10px}
.tip{color:var(--muted)}
.tabbox{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabhd{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.tabsc{overflow-x:auto;padding:4px 4px 0;display:flex;flex-direction:column;gap:2px;-webkit-overflow-scrolling:touch}
.tabsc svg{display:block;flex:none}
.tabft{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:6px 10px;border-top:1px solid var(--line)}
.tplay{padding:4px 12px;font-size:13px}
.tplay[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.lvl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.lvl .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lvlb{display:flex;gap:4px}
.lvlb button{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:34px;padding:4px 10px;font-family:var(--f-mono);font-size:14px}
.lvlb button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.lvld{font-size:13px}
.tloop{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tb text{font-family:var(--f-mono)}
.tb .ln{stroke:var(--muted);stroke-opacity:.45}
.tb .br{stroke:var(--muted);stroke-width:1.2}
.tb .sl{fill:var(--muted);font-size:10px}
.tb .nb{fill:var(--surface-2)}
.tb .nt{fill:var(--fg);font-size:12px;font-weight:600}
.tb .lt{fill:var(--muted);font-size:9px}
.tb .an{fill:var(--muted);font-size:9px;font-family:var(--f-body);font-weight:600;letter-spacing:.03em}
.tb .tq{fill:none;stroke:var(--muted);stroke-width:1.1}
.tb .dsh{fill:none;stroke:var(--muted);stroke-dasharray:3 2}
.tb .ah{fill:var(--muted)}
.tb .stm,.tb .rsl{stroke:var(--fg);stroke-width:1.2;fill:none}
.tb .bm,.tb .rs{fill:var(--fg)}
.tb .tu{fill:var(--muted);font-size:10px}
.tb .hl{fill:var(--accent);opacity:0}
.tb .hl.on{opacity:.14}
.tb .ev.on .nb{fill:var(--accent)}
.tb .ev.on .nt{fill:var(--accent-ink)}
.tb .ev.on .rs{fill:var(--accent)}
.legend{font-size:12px;color:var(--muted)}

.tests{display:flex;flex-direction:column;gap:12px}
.test{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.test .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.test input{width:90px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--f-mono)}
.test .hist{font-size:12px;color:var(--muted);font-family:var(--f-mono)}

.metro{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mstate{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;min-height:26px}
.mstate.play{color:var(--k-music)}
.mstate.rest{color:var(--k-test)}
.mbpm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mbpm button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;height:38px;min-width:42px;font-family:var(--f-mono)}
.mbpm input{width:96px;height:38px;text-align:center;font-family:var(--f-mono);font-size:22px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:6px}
.mbpm .u{color:var(--muted);font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.dots{display:flex;gap:6px;flex-wrap:wrap;min-height:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2)}
.dots i.g{border-color:var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots i.on.r{background:var(--k-test);border-color:var(--k-test)}
.mopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.mopts label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mopts select{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--fg)}
.mopts .chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg)}
.mact{display:flex;gap:8px}

.plan{display:flex;flex-direction:column;gap:14px}
.planhd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.planhd h3,.riff h3,.about h3{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;letter-spacing:.02em;text-transform:uppercase}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px}
.plist li:hover{background:var(--surface-2)}
.plist li.cur{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--kc)}
.plist li.done{opacity:.55}
.plist .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.plist .nm{min-width:0}
.plist .nm b{display:block;font-weight:500}
.plist .mn{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.plist li.pause .nm b{color:var(--muted);font-weight:400}

.riff{border:1px solid var(--k-music);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.riff dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0}
.riff dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.riff dd{margin:0}

.about{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.about .panel li{max-width:65ch}
.about ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.safety{border-color:var(--danger)}
.safety h3{color:var(--danger)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:14px;z-index:20}
textarea.share{width:100%;min-height:160px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;font-family:var(--f-mono);font-size:12px;color:var(--fg);padding:8px}

/* тренер: что сейчас (подход/отдых), полоса интервалов, подсказка темпа, что дальше */
.coach{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cohd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cotog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 12px;font-size:12px;font-family:var(--f-mono);min-width:52px}
.cotog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.cost{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap}
.coname{display:flex;flex-direction:column;min-width:0}
.coname b{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.coname span{font-size:13px}
.cost.t-set .coname b{color:var(--k-music)}
.cost.t-rest .coname b,.cost.t-free .coname b{color:var(--muted)}
.cost.t-prep .coname b{color:var(--accent)}
.coclock{font-family:var(--f-mono);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.costrip{display:flex;gap:2px;height:8px}
.costrip i{display:block;min-width:2px;border-radius:2px;overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.costrip i.t-set{box-shadow:inset 0 0 0 1px var(--k-music)}
.costrip b{display:block;height:100%;width:0;background:var(--muted)}
.costrip i.t-set b{background:var(--k-music)}
.cotempo,.conext{margin:0;font-size:14px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.conext{color:var(--muted);font-size:13px}
.coact{display:flex;gap:8px;flex-wrap:wrap}
.test.cur{border-color:var(--k-test);box-shadow:inset 0 0 0 1px var(--k-test)}

@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .now{position:static}
  .cal{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .plist li{grid-template-columns:74px minmax(0,1fr) auto;gap:8px}
  .clock{font-size:40px}
  .week .cell{padding:5px 4px}
  .week .cell .v{font-size:12px;text-overflow:clip}
  .cell .full{display:none}
  .cell .short{display:inline}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="hd">
    <div class="brand">
      <div class="logo" id="logo">Гри<b>ф</b></div>
      <div class="tag" data-i="tag"></div>
    </div>
    <div class="hdr">
      <div class="daynav">
        <button id="prevDay">‹</button>
        <div id="dateLabel"></div>
        <button id="nextDay">›</button>
        <button id="todayBtn" data-i="today"></button>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="ru">RU</button><button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div class="meta" id="meta"></div>
  <div id="notice" hidden class="notice"></div>

  <section class="timebar">
    <span class="lbl" data-i="timeLabel"></span>
    <div class="tchips" id="timeChips"></div>
  </section>

  <section class="cal">
    <div>
      <div class="lbl" style="margin-bottom:6px" data-i="weekLabel"></div>
      <div class="strip week" id="weekStrip"></div>
    </div>
    <div>
      <div class="lbl" style="margin-bottom:6px" data-i="cycleLabel"></div>
      <div class="strip cycle" id="cycleStrip"></div>
    </div>
  </section>

  <main class="grid">
    <section class="panel now" id="now" aria-live="polite">
      <div class="nowhd"><span class="kind" id="nowKind"></span><span id="nowPos"></span></div>
      <h2 class="title" id="nowTitle"></h2>
      <div class="clockrow">
        <div class="clock" id="clock">00:00</div>
        <div class="bar"><i id="bar"></i></div>
      </div>
      <div class="ctrls">
        <button class="btn" id="prevSeg" data-i="back"></button>
        <button class="btn primary" id="playBtn"></button>
        <button class="btn" id="nextSeg" data-i="next"></button>
        <span class="total" id="totalLeft"></span>
      </div>
      <div class="coach" id="coach" hidden></div>
      <div id="nowBody" style="display:flex;flex-direction:column;gap:14px"></div>

      <div class="metro">
        <div class="mtop"><span class="lbl" data-i="metro"></span><span class="mstate" id="mState"></span></div>
        <div class="mbpm">
          <button data-d="-4">−4</button><button data-d="-1">−1</button>
          <input id="bpm" type="number" min="30" max="320" inputmode="numeric" aria-label="bpm">
          <button data-d="1">+1</button><button data-d="4">+4</button>
          <span class="u">bpm</span>
        </div>
        <input id="bpmRange" type="range" min="30" max="320" aria-label="bpm">
        <div class="dots" id="dots"></div>
        <div class="mopts">
          <label><span data-i="meter"></span><select id="mMeter"></select></label>

/* ================= таб ================= */
/* Токен: части через «+» (струна, h|p|t, лад, bЛАД, rЛАД, *, ~), затем m (палм-мьют) и :k (длина в шагах).
   Шаг = доля / деление; деление = sub варианта, токен «/n» меняет его до конца системы. «.» — пауза, «|» — тактовая черта. */
const STR=['e','B','G','D','A','E'];
const TAB_PART=/^([eBGDAE])([hpt]?)(\d{1,2})(?:b(\d{1,2})(?:r(\d{1,2}))?)?(\*?)(~?)$/;
const TAB_TOK=/^(.+?)(m?)(?::(\d+))?$/;
const EPS=1e-6;
const isInt=x=>Math.abs(x-Math.round(x))<EPS;
function parseSystem(src,sub){
  const items=[],errs=[];let n=sub||1,pos=0;
  src.trim().split(/\s+/).forEach(tok=>{
    if(tok==='|'){items.push({bar:true,pos});return;}
    let m=tok.match(/^\/(\d+)$/);
    if(m){n=+m[1];if(n<1||n>8)errs.push('деление '+tok);if(!isInt(pos*n))errs.push(tok+' не на сетке');return;}

    }).filter(Boolean);

const parseTab=(systems,sub)=>systems.map(s=>parseSystem(s,sub));
const tabDen=meter=>+String(meter||'4/4').split('/')[1]||4;
const isP2=x=>x>0&&isInt(Math.log2(x));

function noteVal(k,n,den){
  const w=k/(den*Math.pow(2,Math.floor(Math.log2(n))));

  if(!isP2(w)){if(isP2(w*2/3)){base=w*2/3;dot=true;}else base=Math.pow(2,Math.floor(Math.log2(w)));}

}

function beamKey(pos,meter){
  const g=METERS[meter];

}
const BEND_TXT={1:'½',2:'full',3:'1½',4:'2'};
function renderSystem(sys,meter,si){
  const LG=13,TOP=32,X0=24,SB=TOP+5*LG,S2=SB+26,H=S2+14,den=tabDen(meter);

        const x1=c.x+c.w-4,x0=Math.max(xr+3,x1-34);let d='M'+f1(x0)+' '+(y-9);

/* ================= лады ================= */
const OPEN={E:40,A:45,D:50,G:55,B:59,e:64};
const LOW_TO_HIGH=['E','A','D','G','B','e'];

  {ru:'E фригийский',en:'E Phrygian',pcs:[4,5,7,9,11,0,2]},
  {ru:'E гармонический минор',en:'E harmonic minor',pcs:[4,6,7,9,11,0,3]},
  {ru:'E уменьшённая (полутон–тон)',en:'E diminished (half–whole)',pcs:[4,5,7,8,10,11,1,2]},
  {ru:'E локрийский',en:'E Locrian',pcs:[4,5,7,9,10,0,2]},
  {ru:'E фригийский доминант',en:'E Phrygian dominant',pcs:[4,5,8,9,11,0,2]},
  {ru:'E целотонная',en:'E whole tone',pcs:[4,6,8,10,0,2]}

const matName=m=>m[LANG];
const PHRYG=MATERIALS[0];
function scaleNotesFrom(pcs,start,count){const out=[];for(let m=start;out.length<count;m++){if(pcs.includes(mod(m,12)))out.push(m);}return out;}
function threeNps(mat){
  const cands=[];
  for(let m=45;m<=57;m++){
    if(!mat.pcs.includes(mod(m,12)))continue;
    const notes=scaleNotesFrom(mat.pcs,m,18);
    const frets=notes.map((n,k)=>n-OPEN[LOW_TO_HIGH[Math.floor(k/3)]]);
    cands.push({m,frets,max:Math.max(...frets),min:Math.min(...frets)});
  }
  const ok=cands.filter(c=>c.max<=19&&c.min>=4);
  const pool=ok.length?ok:cands;
  pool.sort((a,b)=>((mod(b.m,12)===4)-(mod(a.m,12)===4))||(a.max-b.max));
  return pool[0].frets.map((f,k)=>({s:LOW_TO_HIGH[Math.floor(k/3)],f,j:k%3}));
}
function npsTokens(mat,mode){
  const up=threeNps(mat), down=up.slice().reverse();
  const tk=(n,dir)=>{if(mode!=='legato'||n.j===(dir==='up'?0:2))return n.s+n.f;return n.s+(dir==='up'?'h':'p')+n.f;};
  return [up.map(n=>tk(n,'up')).join(' '),down.map(n=>tk(n,'down')).join(' ')];
}
// Группы по size соседних ступеней лада на одной струне, вверх; не больше 8 групп.
function stringGroups(mat,str,size){
  const fr=[];for(let f=0;f<=19;f++){if(mat.pcs.includes(mod(OPEN[str]+f,12)))fr.push(f);}
  const groups=[];for(let g=0;g+size-1<fr.length&&groups.length<8;g++)groups.push(fr.slice(g,g+size));
  return groups;
}
// tech(k) — техника k-й ноты группы ('' — медиатором).
const groupsUp=(str,gs,tech)=>gs.map(g=>g.map((f,k)=>str+(tech?tech(k,'up'):'')+f).join(' ')).join(' ');
const groupsDown=(str,gs,tech)=>gs.slice().reverse().map(g=>g.slice().reverse().map((f,k)=>str+(tech?tech(k,'down'):'')+f).join(' ')).join(' ');
function oneStringSeq(mat){
  const gs=stringGroups(mat,'e',3);
  return [groupsUp('e',gs),groupsDown('e',gs)];
}
// Гамма по 3 ноты на струну на струнах [a,b): ноты вверх и вниз; legato — медиатором только первая нота фразы на струне, nowhere — и её хаммером.
function npsRange(mat,a,b,mode){
  const up=threeNps(mat).filter(n=>{const k=LOW_TO_HIGH.indexOf(n.s);return k>=a&&k<b;}),down=up.slice().reverse();
  const tk=(n,dir)=>{const first=n.j===(dir==='up'?0:2);if(mode==='pick'||(first&&mode==='legato'))return n.s+n.f;if(first)return n.s+'h'+n.f;return n.s+(dir==='up'?'h':'p')+n.f;};
  return {up:up.map(n=>tk(n,'up')),down:down.map(n=>tk(n,'down'))};
}

A16:{n:16,name:'Свип на 3 струнах',goal:'Чистое разделение нот в свипе.',how:'Секстоли: одна нота на щелчок деления. Вверх — одно движение вниз через струны, вниз — одно движение вверх. Верхние ноты — хаммер и пулл-офф.',tip:'Палец снимается с лада сразу после ноты. Если звучит аккорд, это ещё не свип.',sub:6,v:[

A17:{n:17,name:'Свип на 5–6 струнах',goal:'Длинный свип одним движением.',how:'12 нот = две секстоли. Играй по кругу без остановки.',tip:'Ребро правой ладони идёт за медиатором и глушит пройденные басовые струны.',sub:6,v:[

A18:{n:18,name:'Уменьшённые и m7b5',goal:'Неоклассические арпеджио жанра.',how:'Уменьшённый септаккорд симметричен: та же форма повторяется каждые 3 лада.',tip:'Сначала сыграй форму аккордом и послушай. Потом свип, медленно, по одной ноте.',sub:4,v:[

A20:{n:20,name:'Перекат пальца',goal:'Ноты одного лада на соседних струнах без звона.',how:'Один палец на двух-трёх струнах: перекатывай подушечку так, чтобы звучала только играемая нота.',tip:'Проверь на чистом звуке: аккорд не должен звенеть.',sub:4,v:[

A21:{n:21,name:'Экономный пикинг',goal:'Гамма по 3 ноты на струну экономно.',how:'На новой струне медиатор продолжает движение в ту же сторону. Вверх по гамме: вниз-вверх-вниз, переход на новую струну — снова вниз.',tip:'Это не свип: каждая нота звучит отдельно и ровно.',sub:6,gen:true,lvl:['Три нижние струны','Шесть струн','Пары струн туда и обратно','Секвенция четвёрками']},

W0:{name:'Warm-up',goal:'Warm up the hands and wake up the ears.',how:'One minute without the guitar: rub your palms until warm, slow wrist and shoulder circles, open and close your fists 20 times. Then slow chromatics across all strings on a clean tone.',tip:'Gentle movement only. Stretching cold hands into pain does harm.',v:['Chromatics']},
W1:{name:'Mobility without the guitar',goal:'Get blood flowing in the hands and forearms.',how:'Rub your palms until warm. Wrist circles both ways, 10 each. Shoulders up, back, down. Open and close your fists 20 times. Shake out relaxed hands.',tip:'No stretching into pain: only warmth and mobility.'},

W3:{name:'Slow sweeps and trills',goal:'Prepare both hands for fast work.',how:'Clean tone. Three-string Am sweep and finger-pair trills at half your working tempo.',tip:'The goal is warm hands, not speed.',v:['Sweep and trills']},
B1:{name:'Single-string tremolo',goal:'Speed and evenness of alternate picking.',how:'Strict down-up, sixteenth notes. Every third set as sextuplets, then thirty-seconds at half tempo.',tip:'Move from the wrist and keep the pick shallow in the string. Downstrokes and upstrokes equally loud.',v:['Open string','Moving across frets','A string']},
B2:{name:'Alternate picking across strings',goal:'Clean pick transitions between strings.',how:'Strict alternate picking, sixteenths. An odd number of notes per string makes you alternate inside and outside string changes.',tip:'Use the smallest possible arc between strings. If you catch the neighbouring string, drop the tempo.',v:['3 notes per string, two strings',{l:'Inside and outside',note:'Start half of your sets with a downstroke on G: that is an inside change, with the pick between the strings. Start the other half with an upstroke: an outside change.'},'Three strings']},

B5:{name:'Muting',goal:'Silence everywhere a note is not played.',how:'High gain. A dot in the tab is a rest. The edge of the picking hand mutes the low strings, free fretting-hand fingers rest on unused strings.',tip:'Test: stop on any rest. It should be silent, with no hum or squeal.',v:[{l:'Palm mute and open notes',note:'E palm-muted, upper notes open.'},'Skips under high gain','Chord and silence']},
R6:{name:'Downpicking',goal:'Downstroke speed and endurance.',how:'Downstrokes only. Eighth notes, triplets on level 4. Find the tempo you can hold for 60 seconds straight and apply the week protocol to it.',tip:'No force needed. Short motion, the pick bounces off the string. Shoulder and neck stay relaxed.',lvl:['Even eighths, few note changes','Note and chord changes','Syncopation and rests','Downpicked triplets'],v:['Moving chugs','Power chords','Across strings','Pedal and notes on D','Chromatic chords',{l:'Octaves',note:'The A string between the octave notes stays silent: a fretting finger touches it lightly.'}]},
R7:{name:'Gallops',goal:'A crisp gallop at any tempo.',how:'Sixteenth subdivision. Choose one picking pattern (alternate or down-down-up) and keep it for the whole set.',tip:'The long note of the gallop does not drop out: it is as loud as the short ones.',lvl:['Hardly any note changes','Note changes','Mixed with sixteenths and rests','String skips and chords'],v:[{l:'Forward gallop',note:'Each group of three: one eighth, then two sixteenths.'},{l:'Reverse gallop',note:'Each group of three: two sixteenths, then one eighth.'},{l:'Chord gallops',note:'Alternate forward and reverse gallops every bar.'},{l:'Chromatic gallop',note:'Each group of three: one eighth, then two sixteenths.'},{l:'Reverse gallop with a tritone',note:'Each group of three: two sixteenths, then one eighth.'},'Gallop in 3/4']},
R8:{name:'Double-stop tremolo',goal:'Even tremolo across several strings.',how:'Alternate sixteenths, plus sextuplets on level 4. The pick catches every string of the interval equally on downstrokes and upstrokes.',tip:'Mute unused strings with the fretting hand: any stray noise is obvious in interval tremolo.',lvl:['Rare changes','A change every 1–2 beats','Syncopation and rests','Sextuplets and string shifts'],v:['Tritone','Power chords','Minor second',{l:'Fourths',note:'Both notes of the fourth with one finger, a flat barre across two strings.'},{l:'Octaves',note:'The string between the octave notes stays silent: a fretting finger touches it lightly.'},'Fifths on D and G']},
R9:{name:'Palm mute vs open notes',goal:'Instant switch of tone colour.',how:'Sixteenths, plus sextuplets on level 4. The palm lands and lifts exactly on the change, the rhythm stays put.',tip:'Open notes should not jump in volume. Compare on a recording.',lvl:['Rare switches, long open notes','A switch every beat or so','Switches on off-beat sixteenths','Sextuplets and rapid switches'],v:[{l:'Chug and open notes',note:'E palm-muted, notes on A open.'},{l:'Chug and chord',note:'The chord rings open for its full length.'},{l:'One note, two colours',note:'One note throughout, only the palm changes.'},{l:'Chug and tritone',note:'E palm-muted, tritones open.'},{l:'Chord with and without the palm',note:'The palm covers the whole chord; the open chord rings for its full length.'},{l:'Chug and high notes',note:'E palm-muted, notes on G open.'}]},
R10:{name:'Stop-start',goal:'Sharp cut-offs and precise entries.',how:'Sixteenths, with triplets and sextuplets on level 4. A dot in the tab is a rest: both hands mute the strings, silence until the next note.',tip:'The cut-off matters as much as the hit. No tails, no hiss.',lvl:['Stops on the beat, long rests','Sixteenth-note stops','Syncopation and displaced entries','Triplets, sextuplets and tricky stops'],v:['Cuts on the beat','Chord stops','3+3+2 groups','Tritone stops',{l:'Stops in 7/8',note:'Count 2+2+3 eighths.'},'Stops and chromatics']},
R11:{name:'Rhythmic groupings',goal:'Exact division of the beat into 3, 4, 5, 6, 7.',how:'The metronome clicks quarter notes with no subdivision; you divide the beat yourself. Each bar of the tab is one metronome beat.',tip:'Count syllables out loud and stress the start of every beat, even when it is a rest.',lvl:['Each division for two beats','A new division every beat','First note of each beat on the A string','Rest on the beat, melody in position'],v:['3 to 7','Sixteenths and sextuplets','Quintuplets and septuplets','7 down to 3','Speed-up: 2, 3, 4, 6','Triplets and quintuplets']},
R12:{name:'Odd meters',goal:'Feel the grouping in an uneven bar.',how:'One note per click, two in the sixteenth-note variant. The metronome switches to the right meter: a click is the bottom number of the meter (an eighth or a sixteenth), accents mark the start of each group. On level 4 the riff is grouped across the meter: the metronome keeps its groups, the riff keeps its own.',tip:'Tap the grouping on your knee first, then play.',lvl:['Chugs, a chord on each group start','Riff by groups','Rests and sixteenths','Grouping across the meter'],v:['7/8 (2+2+3)','5/8 (3+2)','11/8 (3+3+3+2)','9/8 (2+2+2+3)','13/16 (4+4+5)','5/8 (3+2), sixteenths']},
R13:{name:'Polyrhythm',goal:'Hold a figure over a foreign grid.',how:'Sixteenths in 4/4 with the accent on beat one. The figure runs its own cycle and does not adjust to the bar.',tip:'Count the beats out loud (1-2-3-4), not the notes of the figure.',lvl:['A chord on the figure start','Riff figure','A rest and palm mute in the figure','Figure across strings with legato'],v:[{l:'5-note figure',note:'The figure lines up with beat one again after 5 bars.'},{l:'3 against 4',note:'Accent the first note of each group of three. It realigns after 3 bars.'},{l:'7-note figure',note:'Realigns after 7 bars.'},{l:'6-note figure',note:'Accent the first note of each group of six. It realigns after 3 bars.'},{l:'9-note figure',note:'Inside the figure: 4+5. Realigns after 9 bars.'},{l:'7-note figure, 4+3',note:'Accent the first note of each 4+3 group. Realigns after 7 bars.'}]},
R14:{name:'Syncopation',goal:'Hits between the beats without shifting the grid.',how:'Sixteenths; in the triplet variant, eighth-note triplets. E chugs palm-muted, chords and notes open with an accent. A dot is a rest: mute the strings exactly there.',tip:'The metronome holds the strong beats and the hits land between them. Do not let them drift onto the beat.',lvl:['Two syncopations per bar','Syncopated riff','Hits held across the beat','Two bars, dense pattern'],v:['Accent on the “a”','Accent on the “and”','Starting from a rest','Accent on the second sixteenth','Triplets: hit on the third','Single notes instead of chords']},
R15:{name:'Pinch harmonics',goal:'A squeal on the first try.',how:'* is a pinch harmonic: the side of the thumb touches the string right after the pick. Find the spot over the pickup where it rings loudest.',tip:'Add wide vibrato to every harmonic.',lvl:['Long harmonics','Harmonics in quarters and eighths','Vibrato and bends','Harmonics in sixteenths'],v:['One position','Different strings','Inside a riff','E and A strings','High on the neck','Harmonic at the end of a phrase']},
R37:{name:'Tremolo melody',goal:'A melody over continuous tremolo.',how:'Alternate sixteenths without stopping. A melody note lasts one or two beats and changes exactly on the beat; on level 3 it changes every half beat. On level 4 the hand moves to another position, and the pick catches both notes of each double stop.',tip:'The fretting hand changes notes right between two pick strokes. The picking hand does not notice the change.',lvl:['One string','Two strings','A new note every half beat','Position shifts and double stops'],v:['Melody on the A string',{l:'Two strings',note:'Change notes and strings without a gap in the tremolo.'},'Harmonic minor, G and B','Chromatic, E and A','Phrygian dominant, B and e','Phrygian, D and G']},
A16:{name:'Three-string sweep',goal:'Clear note separation in a sweep.',how:'Sextuplets: one note per subdivision click. Going up is one downward motion across the strings, going down is one upward motion. Top notes are hammer-on and pull-off.',tip:'Lift each finger right after its note. If it rings like a chord, it is not a sweep yet.',v:['Am','Am – F – G – Em','Am – E']},
A17:{name:'5–6 string sweep',goal:'A long sweep in one motion.',how:'12 notes = two sextuplets. Loop it without stopping.',tip:'The edge of the picking hand follows the pick and mutes the bass strings behind it.',v:[{l:'Am, 5 strings',note:'At the start of the next loop, pull off from fret 15 to 12.'},{l:'Dm, 5 strings',note:'At the start of the next loop, pull off from fret 8 to 5.'},{l:'Am, 6 strings',note:'Three adjacent strings at fret 5: roll one finger.'}]},
A18:{name:'Diminished and m7b5',goal:'The neoclassical arpeggios of the genre.',how:'The diminished seventh is symmetrical: the same shape repeats every 3 frets.',tip:'Play the shape as a chord first and listen. Then sweep it slowly, one note at a time.',v:['dim7 up in minor thirds','Bm7b5 – E – Am','dim7 on 4 strings']},
A19:{name:'Sweep with tapping and legato',goal:'Extend the arpeggio beyond one position.',how:'t is a picking-hand tap, h a hammer-on, p a pull-off. Keep the pick in your hand and tap with the middle finger.',tip:'The joint between sweep and tap is the weak spot. Drill it on its own: last sweep note, tap, pull-off.',v:['Am, 5 strings','Am7, 3 strings','Dm, 5 strings']},
A20:{name:'Finger roll',goal:'Same-fret notes on adjacent strings without ringing.',how:'One finger covers two or three strings: roll the fingertip so only the played note sounds.',tip:'Check on a clean tone: it must not ring like a chord.',v:['Two strings','Three strings','Roll inside a sweep']},
A21:{name:'Economy picking',goal:'A three-note-per-string scale, economy style.',how:'On a new string the pick keeps moving in the same direction. Going up the scale: down-up-down, and the move to the next string is another down.',tip:'This is not a sweep: every note sounds separately and evenly.',lvl:['Three low strings','Six strings','String pairs up and back','Sequence in fours']},
A22:{name:'Arpeggios with alternate picking',goal:'Wide intervals with strict picking.',how:'Two notes per string, skipping a string, strict alternate picking. It sounds like an arpeggio but is played as a picking line.',tip:'Skip with the smallest arc: the pick barely clears the skipped string.',v:['Am','Em','Dm']},
A23:{name:'Hybrid picking',goal:'Pick and fingers together.',how:'Lowest note with the pick, upper notes with the middle and ring fingers. The hand position does not change.',tip:'Pluck with the fingertip pad. Fingers and pick equally loud.',v:['Am','Am across strings','Em with open string']},
A38:{name:'Four-string sweep',goal:'A mid-length sweep on an even sixteenth grid.',how:'Strings D–G–B–e: shorter than a five-string sweep, longer than a three-string one. Sixteenths: one downward motion going up, one upward motion going down, hammer-on and pull-off at the top.',tip:'The low note on D rings as clearly as the top ones: it is the one most often swallowed.',v:['Am','Em – C',{l:'Dm in sextuplets',note:'No legato: one downward motion going up, one upward motion going down. Three strings at fret 10: roll one finger.'}]},
A39:{name:'Pedal-point picking',goal:'A melody around a repeating note with strict picking.',how:'Strict alternate picking. The pedal is the note the phrase keeps returning to; only the other note changes. It sounds like a melody or an arpeggio but rests on the picking hand.',tip:'The pedal finger stays on its fret: only the melody fingers move.',v:['Pedal on top',{l:'Pedal on the next string',note:'Pedal B12 with the index finger, the melody on e with the other fingers.'},'Triplets with a pedal']},
L24:{name:'Legato',goal:'Even hammer-ons and pull-offs.',how:'First system: a trill with today’s finger pair. Then the cycle scale in legato: pick only the first note on each string, and on level 3 do not pick at all.',tip:'Hammer-ons and pull-offs as loud as picked notes. Pull slightly downward instead of just lifting the finger.',lvl:['Trill and a three-string scale','Trill and a six-string scale','Sextuplet trill, scale without the pick','Sextuplet trill, position shifts on the e string']},
L25:{name:'Hammer-on from nowhere',goal:'Strength and accuracy of every finger.',how:'The picking hand rests: every note is a hammer-on, including the first one on a new string.',tip:'The first note on a string should be as loud as the rest.',lvl:['One string','Three strings','Six strings','String skipping'],v:['Down the strings','Up the strings','Trills without the pick','A Phrygian, fret 5','Chromatic 1-2-3-4','E harmonic minor, fret 12']},
L26:{name:'Stretches',goal:'A wide position without tension.',how:'Fingers 1-2-4 or 1-3-4. Thumb lower behind the neck, elbow closer to the body. The lower on the neck, the wider the frets: each level moves the same stretch further down.',tip:'If it pulls or hurts, go back a level: the same stretch sits higher up the neck there. Stretching is not a strength exercise.',lvl:['From fret 15','From fret 12','From fret 10–11','From fret 8–10'],v:['5 frets','6 frets','7 frets','5 frets, up the strings','6 frets, string skipping','5 frets, shape shifts']},
L27:{name:'Finger independence',goal:'Each finger moves on its own.',how:'Each finger owns its fret. Only the finger whose note is next moves.',tip:'Idle fingers hover low over the strings. The lower, the faster.',lvl:['Short: one or two strings','Up the strings','Up and back','String skipping'],v:['Spider','Spider 1-3 / 2-4',{l:'Pinky alone',note:'Fingers 1 and 2 stay pressed on the two frets below the trill the whole time. Only 3 and 4 play the trill.'},'Spider 1-4 / 2-3','Spider from fret 5','Three-string spider']},
L28:{name:'Position shifts',goal:'Moving along the neck without gaps.',how:'A three- or four-note sequence on one string in the cycle scale. Each group starts one step higher: the hand shifts without breaking the sound.',tip:'Look at the target before the shift, not during it.',lvl:['Four groups up','Eight groups up and down','Groups of four notes','Two strings: up on B, down on e']},
L29:{name:'Tapping',goal:'Even tapping under high gain.',how:'Tap with the picking-hand middle finger, pick tucked into the palm. Pull off from the tap slightly toward the floor.',tip:'The fretting hand mutes unused strings, otherwise everything hums under gain.',lvl:['Simple figure, fewer changes','Base figure','Longer figure per tap','String changes'],v:['Am – F – G – E',{l:'Two tapping fingers',note:'The lower tap with the middle finger, the higher one with the ring finger.'},'Two strings','Em – C – D – B on the B string','Tap trill','Tapping to the open e']},
L30:{name:'Chord shape changes',goal:'Instant shape changes.',how:'Change shape exactly at the change point, with no gap between chords. Fingers land on the new shape together.',tip:'Picture the next shape in advance; do not look at the neck at the moment of the change.',lvl:['Slow changes','A change every two beats','Changes twice as often','Twice as often, with position jumps'],v:['Octave, tritone, fifth','Same at fret 7','Tremolo with changes','Fifths and a tritone at fret 7','Tritones with an octave','Triads on D-G-B']},
L31:{name:'Vibrato and bends',goal:'Exact pitch and a living sound in solos.',how:'b is a bend, r a release, ~ vibrato; ~ after a bend is vibrato on the bent note, never dropping below the target pitch. Bend with 2–3 fingers together; the motion comes from the wrist.',tip:'Check the pitch against a reference note. An out-of-tune bend is more obvious than a speed mistake.',lvl:['Narrow: half step','Whole step','Vibrato on a bend','Step and a half, vibrato on a bend'],v:[{l:'Bends to pitch',note:'Play the target note first, then bend up to the same pitch.'},{l:'Vibrato in time',note:'Vibrato in steady eighths, then triplets, then sixteenths with the metronome.'},'Half, whole, one and a half','Bends on the G string','Unison bend','Bend and release in time']},
L40:{name:'Pull-offs to an open string',goal:'An open-string pedal in legato.',how:'Pick only the first note of each group, then pull off down to the open string. The open string is the pedal the phrase keeps returning to, while the fretting hand shifts to the next position.',tip:'Pull off to the open string slightly toward the floor so it rings just as loud. Mute unused strings with the edge of the picking hand.',lvl:['Triplets','Sixteenths with a hammer-on from the open string','Two strings, sextuplets','String and position changes, sextuplets'],v:['Open e',{l:'Low E',note:'Pick only the first note of each group; the hammer-on from the open string is unpicked too.'},'Two strings','Open A','Open G','Chromatic to the open string']},
C32:{name:'Sweep → alternate picking',goal:'A seamless change between techniques.',how:'Each part on its own first, then join them. The key spot is the joint: the last note of one technique and the first of the next.',tip:'After a sweep the pick sits in a different place. Find the motion that starts the alternate picking and lock it in.',v:['Am','Alternate picking → sweep','Dm','Em, downward sweep','Diminished','Sweep → E pedal'],lvl:['One technique per bar, sweep in triplets','Short combo, joint on the bar line','Joint mid-bar, there and back','Long sweeps, /6 ↔ /4 switch']},
C33:{name:'Legato → tapping → legato',goal:'One line from three techniques.',how:'Each part on its own first, then join them. Pick only the first note on each string.',tip:'Taps as loud as the legato. If the tap sticks out, hit lighter.',v:['High strings','Middle strings','5th position','Phrygian, B and G','Diminished','Harmonic minor'],lvl:['One string, eighths, one technique per bar','Two strings, sixteenths','Three strings, joint mid-bar','Tapping in sextuplets, subdivision switch']},
C34:{name:'Tremolo → chugs → tremolo',goal:'Switch picking-hand techniques without breaking the grid.',how:'Tremolo open, chugs palm-muted. The palm lands and lifts exactly on the change.',tip:'The grid does not drift when the technique changes: the beat stays the beat, even when the subdivision changes on level 4. Check on a recording.',v:['One string','Double stops','Across a string','Melody on the B string','Fifths','Gallop'],lvl:['Chugs in eighths, change on the bar line','Chugs in sixteenths, change on the bar line','Change mid-bar, syncopation','Sextuplet tremolo, subdivision switch']},
C35:{name:'String skipping → sweep',goal:'From picking into a sweep and back.',how:'Each part on its own first, then join them.',tip:'The sweep starts with the motion the skip ended with. Find it.',v:['G–e and Am','Picked arpeggio and sweep','D–B and Am','Em, D–B and sweep','Diminished','Dm, 5th position'],lvl:['Skips in eighths, sweep in triplets','Sixteenths, joint on the bar line','Joint mid-bar, there and back','Wide skips, five-string sweep, subdivision switch']},
C36:{name:'Étude',goal:'Four techniques in a row, like a real riff.',how:'Four fragments in a row. Each one on its own at working tempo first, then pairs (1+2, 2+3, 3+4), then the whole thing.',tip:'Record a full run on your phone. The weak spot is almost always at the joint between fragments.',v:['Étude 1: tremolo, sweep, legato, tap','Étude 2: gallop, arpeggio, dim7, stop',{l:'Étude 3: 7/8, legato, tap, sweep',note:'The first fragment is in 7/8, the rest in 4/4.'},'Étude 4: gallop, pinch harmonics, tremolo fifths, legato',{l:'Étude 5: 5/8, tap, sweep, tremolo fifths',note:'The first fragment is in 5/8, the rest in 4/4.'},{l:'Étude 6: legato, gallop in 6/8, sweep, tap',note:'The second fragment is in 6/8, the rest in 4/4.'}],lvl:['Eighths and triplets, short fragments','Sixteenths and sextuplets','Longer fragments, more strings','Subdivision changes within a fragment']}
};

function dayInfo(i){
  const cycle=Math.floor(i/28), dic=mod(i,28), week=Math.floor(dic/7), dow=dic%7;
  return {i,cycle,week,dow,focus:FOCUS_BY_DOW[dow],occ:(dow===6||dow<3)?0:1,gweek:Math.floor(i/7),pool:i<0?0:mod(cycle,6),material:i<0?MATERIALS[0]:MATERIALS[mod(cycle,6)],isTest:week===3&&dow===6,pre:i<0,date:dateOfIndex(i)};
}

const RIFF_METERS={ru:['4/4','3/4','5/8','7/8','9/8','11/8','13/16','6/8 поверх 4/4'],en:['4/4','3/4','5/8','7/8','9/8','11/8','13/16','6/8 over 4/4']};
const RIFF_RULES={
  ru:['хотя бы одна пауза длиной в целую долю','закончить диссонансом: малая секунда или тритон','только три нижние струны','хотя бы одна квинтоль или септоль','второй раз рифф повторяется с изменённой последней долей','через весь рифф проходит одна нота-педаль','не больше шести разных нот','рифф начинается не с сильной доли','внутри фразы одна смена размера','в риффе есть флажолет медиатором','одно место с тремоло двойными нотами','темп риффа на 20% ниже твоего рабочего, но звучит тяжело'],

function riffOfDay(d){
  const r=rng(Math.imul(d.i+7331,2654435761));
  const list=GROUPS[d.focus];const ti=pickIdx(r,list.length);const mi=pickIdx(r,RIFF_METERS.ru.length);const ri=pickIdx(r,RIFF_RULES.ru.length);
  return {techId:list[ti],mi,ri,material:d.material};
}
function riffText(r){return {meter:RIFF_METERS[LANG][r.mi],material:matName(r.material),tech:X(r.techId,'name'),rule:RIFF_RULES[LANG][r.ri]};}

function seg(kind,min,extra){return Object.assign({kind,min},extra||{});}
function warmSegs(W){
  if(W<=0)return[];
  if(W<=3)return[seg('warm',W,{id:'W0'})];
  if(W<8)return[seg('warm',2,{id:'W1'}),seg('warm',W-2,{id:'W2'})];
  const a=splitInt(W-2,[1,1]);
  return[seg('warm',2,{id:'W1'}),seg('warm',a[0],{id:'W2'}),seg('warm',a[1],{id:'W3'})];
}
function listSegs(kind,ids,total,extra){
  if(total<=0||!ids.length)return[];
  const mins=splitInt(total,ids.map(()=>1));
  return ids.map((id,k)=>seg(kind,mins[k],Object.assign({id},extra||{})));
}
function buildSession(i,T){
  const d=dayInfo(i);
  const a=ALLOC[T];
  const b={W:a.W,B:a.B,F:a.F,M:a.M,C:a.C,Mu:a.Mu};
  if(d.week===3&&T>=45){const f=Math.round(b.F*0.6),m=Math.round(b.M*0.6);b.Mu+=(b.F-f)+(b.M-m);b.F=f;b.M=m;}
  let test=0;
  if(d.isTest){test=Math.min(15,T-b.W);let need=test;for(const k of['B','F','M','C','Mu']){const x=Math.min(b[k],need);b[k]-=x;need-=x;}}
  const segs=[];
  segs.push(...warmSegs(b.W));
  if(test>0)segs.push(seg('test',test,{id:'TESTS'}));
  if(b.B>0){const k=clamp(Math.floor(b.B/3),1,5);const ids=['B1'].concat(rot(['B4','B2','B3','B5'],i).slice(0,k-1));segs.push(...listSegs('base',ids,b.B));}
  if(b.F>0){const list=GROUPS[d.focus],n=list.length,k=clamp(Math.floor(b.F/6),1,n);const ids=rot(list,(d.gweek*2+d.occ)*k).slice(0,k);segs.push(...listSegs(d.focus==='C'?'combo':'focus',ids,b.F,{focus:true}));}
  if(b.M>0){
    const gs=d.focus==='C'?['R','A','L']:['R','A','L'].filter(g=>g!==d.focus);
    const k=clamp(Math.floor(b.M/3.5),1,12);const cnt={};const ids=[];
    for(let j=0;j<k;j++){const g=gs[j%gs.length];cnt[g]=(cnt[g]||0);const Lg=GROUPS[g];ids.push(Lg[mod(i+cnt[g]*3+(g==='R'?0:g==='A'?1:2),Lg.length)]);cnt[g]++;}
    segs.push(...listSegs('maint',[...new Set(ids)],b.M));
  }
  if(b.C>0){
    if(d.focus==='C'){const k=clamp(Math.floor(b.C/10),1,2);const nv=EX.C36.v.length,vs=[mod(d.pool+1,nv),mod(d.pool+2,nv)].slice(0,k);const mins=splitInt(b.C,vs.map(()=>1));vs.forEach((v,j)=>segs.push(seg('combo',mins[j],{id:'C36',variant:v})));}
    else{const k=clamp(Math.floor(b.C/10),1,3);segs.push(...listSegs('combo',rot(GROUPS.C,i).slice(0,k),b.C));}
  }
  if(b.Mu>0){
    let items;
    if(b.Mu<12)items=[['riff',b.Mu]];
    else if(b.Mu<25)items=[['riff',10],['ear',b.Mu-10]];
    else if(b.Mu<45)items=[['riff',10],['ear',15],['comp',Math.max(1,b.Mu-25)]];
    else{const rest=splitInt(b.Mu-12,[30,25,30,15]);items=[['riff',12],['ear',rest[0]],['comp',rest[1]],['rep',rest[2]],['impro',rest[3]]];}
    items.forEach(x=>{if(x[1]>0)segs.push(seg('music',x[1],{mid:x[0]}));});
  }
  const play=segs.reduce((s,x)=>s+x.min,0);
  if(a.pn>0&&segs.length>1){
    const bounds=[];let c=0;segs.forEach((s,j)=>{c+=s.min;if(j<segs.length-1)bounds.push({j,c});});
    const used=new Set();const ins=[];
    for(let k=1;k<=a.pn;k++){
      const target=play*k/(a.pn+1);let best=null;
      bounds.forEach(bd=>{if(used.has(bd.j))return;if(!best||Math.abs(bd.c-target)<Math.abs(best.c-target))best=bd;});
      if(best){used.add(best.j);ins.push(best.j);}
    }
    ins.sort((x,y)=>y-x).forEach(j=>segs.splice(j+1,0,seg('pause',a.pl)));
  }
  const tot=segs.reduce((s,x)=>s+x.min,0);
  if(tot!==T){segs[segs.length-1].min+=T-tot;}
  let tt=0;segs.forEach(s=>{s.start=tt;tt+=s.min;});
  return {d,T,segs,riff:riffOfDay(d)};
}

/* ================= разрешение упражнения ================= */
// Уровень сложности: свой у каждого упражнения, по умолчанию 2, хранится в grif.lvl. Уровень меняет материал, а не план дня.
const LVL_DEF=2;
let LVS=lsGet('lvl',{});if(!LVS||typeof LVS!=='object')LVS={};
const lvlCount=id=>(EX[id]&&EX[id].lvl)?EX[id].lvl.length:0;
function getLvl(id){const n=lvlCount(id);return n?clamp(Math.round(+LVS[id])||LVL_DEF,1,n):0;}
function setLvl(id,k){LVS[id]=k;lsSet('lvl',LVS);}
// Упражнения с gen:true: материал по дню и ладу цикла, уровень lv (1…4) меняет сам рисунок.
function genEx(id,d,lv){
  const mn=matName(d.material),mat=d.material;
  if(id==='B4'){
    const p=PERMS[mod(d.i,24)],run=(strs,base)=>strs.map((st,k)=>p.map(f=>st+(base(k)+f)).join(' ')).join(' ');
    const up=LOW_TO_HIGH,dn=LOW_TO_HIGH.slice().reverse(),skip=['E','D','A','G','D','B','G','e'];
    const t=lv===1?[run(up.slice(0,3),()=>8),run(dn.slice(3),()=>9)]
      :lv===3?[run(up,k=>7+k),run(dn,k=>12-k)]
      :lv===4?[run(skip,()=>8),run(skip.slice().reverse(),()=>9)]
      :[run(up,()=>8),run(dn,()=>9)];
    return {l:L('Порядок пальцев дня: ','Today’s finger order: ')+p.join('-'),t};
  }
  if(id==='A21'){
    const l=mn+L(', 3 ноты на струну',', 3 notes per string');
    if(lv===1){const x=npsRange(mat,0,3,'pick');return {l,t:[x.up.concat(x.down).join(' ')]};}
    if(lv===3){const cell=k=>{const x=npsRange(mat,k,k+2,'pick');return x.up.concat(x.down).join(' ');};return {l,t:[[0,1,2].map(cell).join(' '),[3,4].map(cell).join(' ')]};}
    if(lv===4){const up=npsRange(mat,0,6,'pick').up,g=[];for(let k=0;k<12;k++)g.push(up.slice(k,k+4).join(' '));return {l,sub:4,t:[g.slice(0,4).join(' '),g.slice(4,8).join(' '),g.slice(8).join(' ')]};}
    return {l,t:npsTokens(mat,'pick')};
  }
  if(id==='L24'){
    const pr=PAIRS[mod(d.i,6)],a=11+pr[0],b2=11+pr[1],l=L('Трель ','Trill ')+pr.join('-')+L(' и ',' and ')+mn;
    const tr16=J('/4 G'+a,R('Gh'+b2+' Gp'+a,3),'Gh'+b2),tr6=J('G'+a,R('Gh'+b2+' Gp'+a,5),'Gh'+b2);
    if(lv===1){const x=npsRange(mat,0,3,'legato');return {l,t:[tr16,x.up.concat(x.down).join(' ')]};}
    if(lv===3){const x=npsRange(mat,0,6,'nowhere');return {l,t:[tr6,x.up.join(' '),x.down.join(' ')]};}
    if(lv===4){const gs=stringGroups(mat,'e',3),tc=(k,dir)=>k?(dir==='up'?'h':'p'):'';return {l:L('Трель ','Trill ')+pr.join('-')+L(', ',', ')+mn+L(' на струне e',' on the e string'),t:[tr6,groupsUp('e',gs,tc),groupsDown('e',gs,tc)]};}
    return {l,t:[tr16].concat(npsTokens(mat,'legato'))};
  }
  if(id==='L28'){
    if(lv===1){const gs=stringGroups(mat,'e',3).slice(0,4);return {l:mn+L(' на струне e',' on the e string'),t:[groupsUp('e',gs)]};}
    if(lv===3){const gs=stringGroups(mat,'e',4);return {l:mn+L(' на струне e',' on the e string'),sub:4,t:[groupsUp('e',gs),groupsDown('e',gs)]};}
    if(lv===4){return {l:mn+L(' на струнах B и e',' on the B and e strings'),t:[groupsUp('B',stringGroups(mat,'B',3)),groupsDown('e',stringGroups(mat,'e',3))]};}
    return {l:mn+L(' на струне e',' on the e string'),t:oneStringSeq(mat)};
  }
  return null;
}
// lv — уровень; без него берётся сохранённый для упражнения.
function resolveEx(s,d,lv){
  const ex=EX[s.id];if(!ex)return null;
  const nl=lvlCount(s.id);lv=nl?clamp(lv||getLvl(s.id),1,nl):0;
  let v=null;
  if(ex.gen)v=genEx(s.id,d,lv||LVL_DEF);
  else if(ex.v){
    const idx=mod(s.variant!=null?s.variant:d.pool,ex.v.length);const raw=ex.v[idx];
    const e=(lv&&raw.lv)?raw.lv[lv-1]:raw;
    v={l:VX(s.id,idx,'l'),note:VX(s.id,idx,'note'),t:e.t,sub:e.sub||raw.sub,meter:e.meter||raw.meter};
  }
  return {ex,id:s.id,v,lv,nl,sub:(v&&v.sub)||ex.sub||1,meter:(v&&v.meter)||'4/4'};
}

function chime(){const c=audio();if(!c)return;const t0=c.currentTime+0.02;[0,0.18,0.36].forEach((dt,k)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=k===2?1320:880;g.gain.setValueAtTime(0.0001,t0+dt);g.gain.exponentialRampToValueAtTime(0.4,t0+dt+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+0.16);o.connect(g).connect(c.destination);o.start(t0+dt);o.stop(t0+dt+0.18);});}
setInterval(()=>{
  if(!st.running)return;
  const now=performance.now();st.remain-=(now-st.last)/1000;st.last=now;
  if(st.remain<=0){

    else{st.remain=0;st.running=false;coachRun();renderClock();markPlan();toast(L('Тренировка дня закончена','Today’s workout is done'));return;}

/* ================= метроном ================= */
const METERS={'4/4':[4],'3/4':[3],'6/8':[3,3],'5/8':[3,2],'7/8':[2,2,3],'9/8':[2,2,2,3],'11/8':[3,3,3,2],'13/16':[4,4,5]};
const Mt={ctx:null,on:false,bpm:clamp(lsGet('bpm',100),30,320),meter:'4/4',sub:1,burst:0,ladder:false,next:0,pulse:0,subi:0,bar:0,bc:0,timer:null,q:[]};
function audio(){try{if(!Mt.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;Mt.ctx=new C();}if(Mt.ctx.state==='suspended')Mt.ctx.resume();return Mt.ctx;}catch(e){return null;}}
function meterPulses(){return METERS[Mt.meter].reduce((a,b)=>a+b,0);}
function groupStarts(){const s=new Set();let c=0;METERS[Mt.meter].forEach(g=>{s.add(c);c+=g;});return s;}
function click(tm,level,rest){
  const c=Mt.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=level===0?'sine':'triangle';
  o.frequency.value=[700,1050,1400,1800][level];
  let v=[0.22,0.5,0.7,0.95][level];if(rest)v*=0.22;
  g.gain.setValueAtTime(0.0001,tm);g.gain.exponentialRampToValueAtTime(v,tm+0.002);g.gain.exponentialRampToValueAtTime(0.0001,tm+0.045);
  o.connect(g).connect(c.destination);o.start(tm);o.stop(tm+0.05);
}
function schedule(){
  const c=Mt.ctx;const n=meterPulses(),gs=groupStarts();
  while(Mt.next<c.currentTime+0.12){
    const level=Mt.subi>0?0:(Mt.pulse===0?3:(gs.has(Mt.pulse)?2:1));
    const rest=Mt.burst>0&&Math.floor(Mt.bc/Mt.burst)%2===1;
    click(Mt.next,level,rest);
    if(Mt.subi===0)Mt.q.push({t:Mt.next,p:Mt.pulse,rest});
    Mt.next+=60/Mt.bpm/Mt.sub;Mt.subi++;
    if(Mt.subi>=Mt.sub){Mt.subi=0;Mt.pulse++;Mt.bc++;if(Mt.pulse>=n){Mt.pulse=0;Mt.bar++;if(Mt.ladder&&Mt.bar%8===0)setBpm(Mt.bpm+4);}}
  }
}
function draw(){
  if(!Mt.on)return;
  const c=Mt.ctx;let last=null;
  while(Mt.q.length&&Mt.q[0].t<=c.currentTime)last=Mt.q.shift();
  if(last){
    [...$('dots').children].forEach((el,k)=>{el.classList.toggle('on',k===last.p);el.classList.toggle('r',last.rest);});
    const ms=$('mState');
    if(Mt.burst>0){ms.textContent=last.rest?t('rest'):t('play');ms.className='mstate '+(last.rest?'rest':'play');}
    else{ms.textContent='';ms.className='mstate';}
  }
  requestAnimationFrame(draw);
}
function renderDots(){const gs=groupStarts();$('dots').innerHTML=Array.from({length:meterPulses()},(_,k)=>'<i class="'+(gs.has(k)?'g':'')+'"></i>').join('');}
function metroStart(){const c=audio();if(!c){toast(L('Звук недоступен в этом браузере','Sound is not available in this browser'));return;}Mt.on=true;Mt.pulse=0;Mt.subi=0;Mt.bar=0;Mt.bc=0;Mt.q=[];Mt.next=c.currentTime+0.08;schedule();Mt.timer=setInterval(schedule,25);$('mToggle').textContent=t('mOff');requestAnimationFrame(draw);wantWake();}
function metroStop(){Mt.on=false;clearInterval(Mt.timer);Mt.timer=null;$('mToggle').textContent=t('mOn');$('mState').textContent='';$('mState').className='mstate';[...$('dots').children].forEach(el=>el.classList.remove('on','r'));}
function curExKey(){const s=st.plan&&st.plan.segs[st.cur];return s&&s.id?s.id:null;}
function setBpm(v){
  Mt.bpm=clamp(Math.round(v)||Mt.bpm,30,320);
  $('bpm').value=Mt.bpm;$('bpmRange').value=Mt.bpm;
  lsSet('bpm',Mt.bpm);const k=curExKey();if(k){const m=lsGet('bpmEx',{});m[k]=Mt.bpm;lsSet('bpmEx',m);}
}
function setMeter(m){Mt.meter=METERS[m]?m:'4/4';$('mMeter').value=Mt.meter;Mt.pulse=0;Mt.bc=0;renderDots();}
function setSub(n){Mt.sub=[1,2,3,4,6].includes(+n)?+n:1;$('mSub').value=String(Mt.sub);}
function applyMetroDefaults(){
  const s=st.plan.segs[st.cur];const d=st.plan.d;
  if(s.id&&EX[s.id]){const r=resolveEx(s,d);setSub(r.sub);setMeter(r.meter);const m=lsGet('bpmEx',{});if(m[s.id])setBpm(m[s.id]);}
  else setMeter('4/4');
  const fast=s.kind==='focus'||s.kind==='base'||s.kind==='combo';
  if(!(fast&&d.week===2)){Mt.burst=0;$('mBurst').value='0';}
}

/* ================= плеер ================= */
// Синтез гитары: Karplus–Strong в буфер (кэш по высоте) → перегруз WaveShaper → «кабинет». Время в долях метронома, темп — Mt.bpm.
const Pl={on:false,key:null,box:null,ev:[],i:0,next:0,pos:0,bar:4,loop:true,timer:null,bus:null,bufs:{},voices:[],q:[],lit:''};
function plLabel(on){return on?'■ '+L('Стоп','Stop'):'▶ '+L('Послушать','Listen');}
function plBus(c){
  if(Pl.bus)return Pl.bus;
  const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=110;
  const drive=c.createGain();drive.gain.value=9;
  const sh=c.createWaveShaper(),cv=new Float32Array(2048);
  for(let i=0;i<cv.length;i++){const x=i/(cv.length-1)*2-1;cv[i]=Math.tanh(2.5*x);}
  sh.curve=cv;sh.oversample='4x';
  const mid=c.createBiquadFilter();mid.type='peaking';mid.frequency.value=800;mid.Q.value=0.8;mid.gain.value=-6;
  const cab=c.createBiquadFilter();cab.type='lowpass';cab.frequency.value=4500;cab.Q.value=0.9;
  const out=c.createGain();out.gain.value=0.16;
  hp.connect(drive).connect(sh).connect(mid).connect(cab).connect(out).connect(c.destination);
  return Pl.bus=hp;
}
function plBuf(c,midi,pm){
  const key=midi+(pm?'m':'');if(Pl.bufs[key])return Pl.bufs[key];
  const sr=c.sampleRate,f=440*Math.pow(2,(midi-69)/12),N=Math.max(2,Math.round(sr/f-0.5));
  const len=Math.floor(sr*(pm?0.5:2.2)),b=c.createBuffer(1,len,sr),y=b.getChannelData(0),r=rng(midi*31+(pm?7:0));
  let lp=0,mean=0;
  for(let i=0;i<N;i++){lp+=(pm?0.3:0.75)*((r()*2-1)-lp);y[i]=lp;mean+=lp/N;}
  for(let i=0;i<N;i++)y[i]-=mean;
  const d=Math.pow(0.001,1/(f*(pm?0.2:3)));
  for(let i=N;i<len;i++)y[i]=d*0.5*(y[i-N]+(i>N?y[i-N-1]:0));
  return Pl.bufs[key]={b,rate:f*(N+0.5)/sr};
}
function plNote(c,nt,t0,len,pm,vel){
  const bf=plBuf(c,OPEN[nt.s]+nt.f+(nt.ph?19:0),pm);
  const src=c.createBufferSource(),g=c.createGain(),pr=src.playbackRate,rt=bf.rate;
  src.buffer=bf.b;pr.setValueAtTime(rt,t0);
  if(nt.b!=null){const up=rt*Math.pow(2,(nt.b-nt.f)/12);pr.linearRampToValueAtTime(up,t0+len*0.35);
    if(nt.r!=null){pr.setValueAtTime(up,t0+len*0.6);pr.linearRampToValueAtTime(rt*Math.pow(2,(nt.r-nt.f)/12),t0+len*0.9);}}
  let lfo=null;
  if(nt.vib){lfo=c.createOscillator();const lg=c.createGain();lfo.frequency.value=5.5;lg.gain.setValueAtTime(0,t0);lg.gain.linearRampToValueAtTime(rt*(nt.b!=null?Math.pow(2,(nt.b-nt.f)/12):1)*0.022,t0+Math.min(0.25,len*0.4));lfo.connect(lg).connect(pr);lfo.start(t0);lfo.stop(t0+len+0.1);}
  g.gain.setValueAtTime(vel,t0);g.gain.setValueAtTime(vel,t0+len);g.gain.setTargetAtTime(0,t0+len,0.012);
  let node=src;
  if(pm){const lpf=c.createBiquadFilter();lpf.type='lowpass';lpf.frequency.value=900;node=src.connect(lpf);}
  node.connect(g).connect(plBus(c));
  src.start(t0);src.stop(t0+len+0.12);
  Pl.voices.push({src,g,lfo,end:t0+len+0.12});
}
function plClick(c,tm,acc){
  const o=c.createOscillator(),g=c.createGain();o.frequency.value=acc?1600:1150;
  g.gain.setValueAtTime(0.0001,tm);g.gain.exponentialRampToValueAtTime(acc?0.32:0.18,tm+0.002);g.gain.exponentialRampToValueAtTime(0.0001,tm+0.04);
  o.connect(g).connect(c.destination);o.start(tm);o.stop(tm+0.05);
}
function plTick(){
  const c=Mt.ctx;if(!Pl.on||!c)return;
  if(!Pl.box||!Pl.box.isConnected){
    // таб перерисован (язык, тот же сегмент) — продолжаем на новом элементе, иначе стоп
    Pl.box=[...document.querySelectorAll('.tabbox[data-tab]')].find(b=>b.dataset.tab===Pl.key)||null;Pl.lit='';
    if(!Pl.box){plStop();return;}
  }
  Pl.voices=Pl.voices.filter(v=>v.end>c.currentTime);
  while(Pl.next<c.currentTime+0.15){
    if(Pl.i>=Pl.ev.length){if(!Pl.loop){if(c.currentTime>=Pl.next)plStop();return;}Pl.i=0;}
    const e=Pl.ev[Pl.i],spb=60/Mt.bpm,len=e.dur*spb;
    if(!e.rest){const vel=0.9/Math.sqrt(e.notes.length);e.notes.forEach(nt=>plNote(c,nt,Pl.next,len,e.pm,nt.tech?vel*0.6:vel));}
    if(!Mt.on)for(let p=Math.ceil(Pl.pos-EPS);p<Pl.pos+e.dur-EPS;p++)plClick(c,Pl.next+(p-Pl.pos)*spb,mod(p,Pl.bar)===0);
    Pl.q.push({t:Pl.next,id:e.id});
    Pl.next+=len;Pl.pos+=e.dur;Pl.i++;
  }
}
function plDraw(){
  if(!Pl.on)return;
  const c=Mt.ctx;let last=null;
  while(Pl.q.length&&Pl.q[0].t<=c.currentTime)last=Pl.q.shift();
  if(last&&Pl.box&&last.id!==Pl.lit){
    Pl.box.querySelectorAll('.on[data-e]').forEach(el=>el.classList.remove('on'));
    const els=Pl.box.querySelectorAll('[data-e="'+last.id+'"]');els.forEach(el=>el.classList.add('on'));Pl.lit=last.id;
    const sc=Pl.box.querySelector('.tabsc');
    if(sc&&els[0]){const r=els[0].getBoundingClientRect(),sr=sc.getBoundingClientRect();if(r.left<sr.left||r.right>sr.right-8)sc.scrollLeft+=r.left-sr.left-24;}
  }
  requestAnimationFrame(plDraw);
}
function plButtons(){document.querySelectorAll('.tabbox [data-play]').forEach(b=>{const on=Pl.on&&b.closest('.tabbox')===Pl.box;b.textContent=plLabel(on);b.setAttribute('aria-pressed',String(on));});}
function plStart(box){
  plStop();
  const c=audio();if(!c){toast(L('Звук недоступен в этом браузере','Sound is not available in this browser'));return;}
  const [systems,sub,meter]=JSON.parse(box.dataset.tab);
  Pl.ev=[];parseTab(systems,sub).forEach((s,si)=>{let ci=0;s.items.forEach(it=>{if(!it.bar)Pl.ev.push(Object.assign({id:si+'.'+ci},it));ci++;});});
  if(!Pl.ev.length)return;
  Pl.key=box.dataset.tab;Pl.box=box;Pl.bar=+meter.split('/')[0]||4;Pl.i=0;Pl.pos=0;Pl.q=[];Pl.lit='';
  Pl.next=c.currentTime+0.12;
  if(Mt.on&&Mt.next){
    // вступаем с ближайшей сильной доли включённого метронома
    const sp=60/Mt.bpm,n=meterPulses();let tp=Mt.next,p=Mt.pulse;
    if(Mt.subi>0){tp+=(Mt.sub-Mt.subi)*sp/Mt.sub;p++;}
    Pl.next=tp+mod(n-p,n)*sp;
    if(Pl.next<c.currentTime+0.05)Pl.next+=n*sp;
  }
  Pl.on=true;Pl.timer=setInterval(plTick,25);plTick();requestAnimationFrame(plDraw);plButtons();
}
function plStop(){
  if(!Pl.on)return;
  Pl.on=false;clearInterval(Pl.timer);Pl.timer=null;
  const c=Mt.ctx,now=c?c.currentTime:0;
  Pl.voices.forEach(v=>{try{v.g.gain.cancelScheduledValues(now);v.g.gain.setTargetAtTime(0,now,0.01);v.src.stop(now+0.06);if(v.lfo)v.lfo.stop(now+0.06);}catch(e){}});
  Pl.voices=[];Pl.q=[];
  if(Pl.box)Pl.box.querySelectorAll('.on[data-e]').forEach(el=>el.classList.remove('on'));
  plButtons();Pl.box=null;Pl.key=null;
}
$('nowBody').addEventListener('click',e=>{const b=e.target.closest('button[data-play]');if(!b)return;const box=b.closest('.tabbox');if(Pl.on&&Pl.box===box)plStop();else plStart(box);});

/* ================= тренер ================= */
// Ведение внутри сегмента: подготовка → подходы и отдых по протоколу недели (PHASES[].co) или поддержки (MAINT_CO),
// плюс указания упражнений из COACH. Длительности кратны 5 с, их сумма равна минутам сегмента.
// Тренер сам включает метроном, деление, размер и рывки, но bpm не меняет: только подсказывает.
const CO_PREP=10;
const WARM_CO={set:[40,120,60],rest:[10,20,15],n:[2,3]};
const TEST_CO={set:{T1:[30,30,30],T3:[60,60,60]},def:[15,30,20],rest:[20,30,20]};
const TEMPO={
  find:['Найди чистый темп: начни медленно, после каждого чистого прохода +4 bpm.','Find your clean tempo: start slow and add 4 bpm after every clean run.'],
  vol:['Рабочий темп: на 20% ниже найденного чистого.','Working tempo: 20% below the clean tempo you found.'],
  build0:['Начни на 10% ниже вчерашнего чистого темпа.','Start 10% below yesterday’s clean tempo.'],
  build:['Прошлый подход чистый — прибавь 4 bpm. Была ошибка или зажим — убавь 8 bpm.','Last set clean: add 4 bpm. A mistake or tension: take off 8 bpm.'],
  top:['Самый высокий чистый темп, без прибавки.','Your highest clean tempo, no more adding.'],
  burst:['На 10–15% выше чистого темпа.','10–15% above your clean tempo.'],
  same:['Темп тот же.','Same tempo.'],
  work:['Рабочий темп: на 10% ниже чистого.','Working tempo: 10% below clean.'],
  deload:['На 20% ниже чистого темпа.','20% below your clean tempo.'],
  maint:['Рабочий темп: на 10–15% ниже чистого.','Working tempo: 10–15% below clean.'],
  half:['Половина темпа: 32-е, по две ноты на щелчок.','Half tempo: 32nds, two notes per click.'],
  back:['Верни прежний темп.','Go back to your previous tempo.'],
  warm:['Половина рабочего темпа.','Half your working tempo.'],
  ladder0:['Начни на комфортном темпе.','Start at a comfortable tempo.'],
  ladder:['Прошлый проход чистый — прибавь 4 bpm. Ошибка или зажим — стоп: результат — последний чистый темп, запиши его.','Last run clean: add 4 bpm. A mistake or tension: stop. Your result is the last clean tempo, save it.']
};
const COMBO_STAGES=[['Каждая техника отдельно','Each technique on its own'],['Стык: две ноты на границе техник','The joint: the two notes where techniques meet'],['Вся фраза','The whole phrase']];
// Указания упражнений: cyc — по кругу на подходы, v — только для варианта с этим индексом, stages — этапы от первого подхода к последнему.
const COACH={
  W0:{free:60},
  B1:{cyc:[{},{},{sub:6,tag:['Секстоли','Sextuplets']},{sub:4,half:true,tag:['32-е на половине темпа','32nds at half tempo']}]},
  B2:{v:{1:{cyc:[{tag:['Начни даунстроком: переход «внутри»','Start on a downstroke: inside change']},{tag:['Начни апстроком: переход «снаружи»','Start on an upstroke: outside change']}]}}},
  L31:{v:{1:{cyc:[{sub:2,tag:['Вибрато восьмыми','Vibrato in 8ths']},{sub:3,tag:['Вибрато триолями','Vibrato in triplets']},{sub:4,tag:['Вибрато 16-ми','Vibrato in 16ths']}]}}},
  C36:{stages:[['Фрагмент 1 отдельно','Fragment 1 on its own'],['Фрагмент 2 отдельно','Fragment 2 on its own'],['Фрагмент 3 отдельно','Fragment 3 on its own'],['Фрагмент 4 отдельно','Fragment 4 on its own'],['Пара 1+2','Pair 1+2'],['Пара 2+3','Pair 2+3'],['Пара 3+4','Pair 3+4'],['Целиком','The whole étude']],v:{2:{stageMeter:{0:'7/8'}},4:{stageMeter:{0:'5/8'}},5:{stageMeter:{1:'6/8'}}}}
};
const rng3=a=>({lo:a[0],hi:a[1],p:a[2]});
// Подогнать длительности к S секундам шагом 5 с: сначала в пределах диапазонов, потом за счёт подходов. null — не выходит.
function coFit(items,S){
  const d=items.map(x=>x.p);let D=S-d.reduce((a,b)=>a+b,0);
  const sweep=ok=>{let moved=true;while(D&&moved){moved=false;items.forEach((x,k)=>{const s=D>0?5:-5;if(D&&ok(x,d[k]+s)){d[k]+=s;D-=s;moved=true;}});}};
  sweep((x,v)=>v>=x.lo&&v<=x.hi);
  sweep((x,v)=>x.flex&&v>=10);
  return D?null:d;
}
// Перебрать число подходов и отдых в конце; взять раскладку, ближе всего к «обычно» и без выхода за диапазоны.
function coLayout(S,head,setAt,rest,nPref){
  let best=null;
  const nMax=Math.min(40,Math.floor(S/20)+1);
  for(let n=1;n<=nMax;n++)for(const trail of[0,1]){
    const items=head.map(x=>Object.assign({},x));
    for(let k=0;k<n;k++){items.push(Object.assign({type:'set',flex:true,k,n},setAt(k,n)));if(k<n-1||trail)items.push(Object.assign({type:'rest'},rest(k,n)));}
    const d=coFit(items,S);if(!d)continue;
    let dev=0,out=0;items.forEach((x,j)=>{dev+=Math.abs(d[j]-x.p)/x.p;out+=Math.max(0,x.lo-d[j],d[j]-x.hi);});
    let c=dev/items.length+out/20+(trail?0.25:0);
    if(nPref)c+=0.5*Math.max(0,nPref[0]-n,n-nPref[1]);
    if(!best||c<best.c-1e-9)best={c,items,d};
  }
  return best.items.map((x,j)=>{const o=Object.assign({},x,{sec:best.d[j]});delete o.lo;delete o.hi;delete o.p;delete o.flex;return o;});
}
const fixed=(type,sec,extra)=>Object.assign({type,lo:sec,hi:sec,p:sec},extra||{});
function coachPlan(s,d){
  const S=s.min*60;
  if(s.kind==='test'){
    const mins=splitInt(s.min,TESTS.map(()=>1));const out=[];
    TESTS.forEach((tt,j)=>{
      if(!mins[j])return;
      const base={blk:j,test:tt.id,tag:[[tt.ru[0],tt.en[0]]],sub:tt.sub,meter:'4/4',burst:0};
      const sr=rng3(TEST_CO.set[tt.id]||TEST_CO.def);
      out.push(...coLayout(mins[j]*60,[fixed('prep',CO_PREP,base)],k=>Object.assign({},base,sr,{tempo:[k?'ladder':'ladder0']}),()=>Object.assign({blk:j},rng3(TEST_CO.rest)),null));
    });
    return out;
  }
  const lead=s.kind==='warm'?s.id!=='W1':['base','focus','maint','combo'].includes(s.kind);
  if(!lead)return null;
  const r=resolveEx(s,d);const c=COACH[s.id]||{};
  const vi=(EX[s.id].v&&EX[s.id].v.length)?mod(s.variant!=null?s.variant:d.pool,EX[s.id].v.length):-1;
  const cv=(c.v&&c.v[vi])||{};const cyc=cv.cyc||c.cyc;const stages=cv.stages||c.stages||(s.kind==='combo'?COMBO_STAGES:null);
  const head=[];if(c.free)head.push(fixed('free',c.free));head.push(fixed('prep',CO_PREP));
  let co,nPref=null;
  if(s.kind==='warm'){co=WARM_CO;nPref=WARM_CO.n;}
  else if(s.kind==='maint'){co=MAINT_CO;nPref=MAINT_CO.n;}
  else co=PHASES[d.week].co;
  const speed=d.week===2&&s.kind!=='warm'&&s.kind!=='maint';
  const setAt=(k,n)=>{
    const x=Object.assign(rng3(co.set),{sub:r.sub,meter:r.meter,burst:0,tag:[],tempo:[]});
    if(s.kind==='warm')x.tempo=['warm'];
    else if(s.kind==='maint')x.tempo=['maint'];
    else if(d.week===0)x.tempo=[n>1&&k===0?'find':'vol'];
    else if(d.week===1)x.tempo=[k===0?'build0':(n>=5&&k>=n-3?'top':'build')];
    else if(d.week===2){
      if(k%4===3){Object.assign(x,rng3(co.work));x.tag.push(['Минута на рабочем темпе, без рывков','A minute at working tempo, no bursts']);x.tempo=['work'];}
      else{const b=[1,2,4][(k-Math.floor((k+1)/4))%3];x.burst=b;x.tag.push(['Рывки '+b+'/'+b,'Bursts '+b+'/'+b]);x.tempo=[k%4===0?'burst':'same'];}
    }
    else{x.tempo=['deload'];if(n>=2&&k===Math.floor(n/2))x.tag.push(['Чистым звуком, без перегруза','Clean tone, no gain']);}
    if(stages){const g=n===1?stages.length-1:Math.round(k*(stages.length-1)/(n-1));x.tag.unshift(stages[g]);if(cv.stageMeter&&cv.stageMeter[g])x.meter=cv.stageMeter[g];}
    if(cyc){const o=cyc[k%cyc.length];if(o.sub)x.sub=o.sub;if(o.tag)x.tag.push(o.tag);if(o.half){x.burst=0;x.tempo=['half'];}
      if(k>0&&cyc[(k-1)%cyc.length].half)x.tempo.unshift('back');}
    return x;
  };
  const rest=()=>rng3(co.rest);
  return coLayout(S,head,setAt,rest,nPref);
}

const co={on:true,key:'',iv:null,idx:-1,beep:0};
const coActive=()=>co.on&&!!co.iv;
// Смена уровня пересчитывает указания, но не позицию: раскладка подходов от уровня не зависит.
function coSync(){
  const s=st.plan.segs[st.cur],key=st.i+'|'+st.T+'|'+st.cur,lk=s.id?getLvl(s.id):0;
  if(co.key!==key){co.key=key;co.lk=lk;co.iv=coachPlan(s,st.plan.d);co.idx=-1;co.beep=0;}
  else if(co.lk!==lk){co.lk=lk;co.iv=coachPlan(s,st.plan.d);}
}
// Где мы внутри сегмента: индекс интервала и сколько секунд до его конца.
function coPos(){
  const el=st.plan.segs[st.cur].min*60-st.remain;let c=0;
  for(let k=0;k<co.iv.length;k++){c+=co.iv[k].sec;if(el<c-1e-6)return{k,left:c-el};}
  return{k:co.iv.length-1,left:0};
}
function cue(kind){
  const c=audio();if(!c)return;const t0=c.currentTime+0.01;
  (kind==='tick'?[0]:[0,0.16]).forEach(dt=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=kind==='tick'?660:440;
    g.gain.setValueAtTime(0.0001,t0+dt);g.gain.exponentialRampToValueAtTime(0.35,t0+dt+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+0.12);o.connect(g).connect(c.destination);o.start(t0+dt);o.stop(t0+dt+0.14);});
}
function coApply(x,prev){
  if(x.type==='set'){
    setSub(x.sub);setMeter(x.meter);Mt.burst=x.burst;Mt.bc=0;$('mBurst').value=String(x.burst);
    if(Mt.on)metroStop();metroStart();
  }else{
    if(Mt.on)metroStop();
    if(prev&&prev.type==='set')cue('end');
  }
}
function coachTick(){
  coSync();if(!coActive())return;
  const p=coPos(),x=co.iv[p.k];
  if(p.k!==co.idx){const prev=co.idx>=0?co.iv[co.idx]:null;co.idx=p.k;co.beep=0;coApply(x,prev);renderCoach();}
  const nx=co.iv[p.k+1];
  if(x.type!=='set'&&nx&&nx.type==='set'){const n=Math.ceil(p.left);if(n>=1&&n<=3&&n!==co.beep){co.beep=n;cue('tick');}}
  renderCoachClock(p);
}
// Пауза таймера останавливает метроном; после «Продолжить» текущий интервал применяется заново.
function coachRun(){if(!coActive())return;if(st.running)co.idx=-1;else metroStop();}
function coSkipTo(sec){
  st.remain=Math.max(0,sec);
  if(st.remain<=0.001){st.done.add(st.cur);if(st.cur<st.plan.segs.length-1){goto(st.cur+1,st.running);return;}st.remain=0;}
  if(!st.running)co.idx=-1;
  renderClock();
  if(st.running)coachTick();else renderCoach();
}
function coName(x){
  if(x.type==='prep')return L('Приготовься','Get ready');
  if(x.type==='free')return L('Без гитары','No guitar');
  if(x.type==='rest')return L('Отдых','Rest');
  return(x.test?L('Проход ','Run '):L('Подход ','Set '))+(x.k+1)+L(' из ',' of ')+x.n;
}
const coTag=x=>(x.tag||[]).map(p=>L(p[0],p[1])).join(' · ');
const coTempo=x=>(x.tempo||[]).map(k=>L(TEMPO[k][0],TEMPO[k][1])).join(' ');
function renderCoach(){
  coSync();const box=$('coach');
  if(!co.iv){box.hidden=true;box.innerHTML='';return;}
  box.hidden=false;
  let h='<div class="cohd"><span class="lbl">'+L('Ведение по подходам','Set-by-set coaching')+'</span><button class="cotog" id="coToggle" aria-pressed="'+co.on+'">'+(co.on?L('Вкл','On'):L('Выкл','Off'))+'</button></div>';
  if(!co.on){box.innerHTML=h+'<p class="legend" style="margin:0">'+L('Ведение выключено: таймер считает только минуты блока, метроном включаешь сам.','Coaching is off: the timer only counts the block’s minutes, and you run the metronome yourself.')+'</p>';return;}
  const p=coPos(),x=co.iv[p.k];
  const nextSet=x.type==='set'?x:co.iv.slice(p.k+1).find(y=>y.type==='set');
  const after=co.iv.slice(p.k+1,p.k+3);
  h+='<div class="cost t-'+x.type+'"><div class="coname"><b>'+esc(coName(x))+'</b>'+(coTag(x)?'<span>'+esc(coTag(x))+'</span>':'')+'</div><div class="coclock" id="coClock">'+fmt(p.left)+'</div></div>';
  h+='<div class="costrip" id="coStrip">'+co.iv.map((y,k)=>'<i class="t-'+y.type+'" style="flex-grow:'+y.sec+'"><b style="width:'+(k<p.k?100:0)+'%"></b></i>').join('')+'</div>';
  if(nextSet&&coTempo(nextSet))h+='<p class="cotempo"><span class="lbl">'+(x.type==='set'?L('Темп','Tempo'):L('Темп к подходу','Tempo for the set'))+'</span>'+esc(coTempo(nextSet))+'</p>';
  h+='<p class="conext"><span class="lbl">'+L('Дальше','Next')+'</span>'+(after.length?after.map(y=>esc(coName(y)+(y.type==='set'&&coTag(y)?' · '+coTag(y):''))+' '+fmt(y.sec)).join(' → '):esc(L('конец блока','end of block')))+'</p>';
  const skip=x.type==='set'?L('Пропустить подход','Skip set'):x.type==='rest'?L('Пропустить отдых','Skip rest'):L('Сразу к подходу','Start the set now');
  h+='<div class="coact"><button class="btn" id="coSkip">'+skip+'</button>';
  if(x.blk!=null&&co.iv.some(y=>y.blk>x.blk))h+='<button class="btn" id="coSkipBlk">'+L('Следующий тест','Next test')+'</button>';
  h+='</div>';
  box.innerHTML=h;
  document.querySelectorAll('#nowBody .test').forEach((el,j)=>el.classList.toggle('cur',j===x.blk));
}
function renderCoachClock(p){
  const c=$('coClock');if(!c)return;
  c.textContent=fmt(p.left);
  const cell=$('coStrip').children[p.k];if(cell)cell.firstChild.style.width=(100*(1-p.left/co.iv[p.k].sec))+'%';
}
$('coach').addEventListener('click',e=>{
  if(e.target.closest('#coToggle')){co.on=!co.on;co.idx=-1;if(co.on&&st.running)coachTick();renderCoach();return;}
  if(!coActive())return;
  const p=coPos();
  if(e.target.closest('#coSkip'))coSkipTo(st.remain-p.left);
  else if(e.target.closest('#coSkipBlk')){const b=co.iv[p.k].blk;let el=0,c=0;co.iv.forEach(y=>{c+=y.sec;if(y.blk<=b)el=c;});coSkipTo(st.plan.segs[st.cur].min*60-el);}
});

function rebuild(){
  st.plan=buildSession(st.i,st.T);
  st.done=new Set();st.running=false;st.cur=0;st.remain=st.plan.segs[0].min*60;
  metroStop();
  renderHeader();renderPlan();applyMetroDefaults();renderNow();
}
function setLang(l){
  LANG=l;lsSet('lang',l);
  try{history.replaceState(null,'','#'+l);}catch(e){try{location.hash=l;}catch(e2){}}
  renderStatic();renderHeader();renderPlan();renderNow();markPlan();
}

// Уровень меняется на ходу: таймер и позиция тренера не трогаются, деление и размер метронома — по новому материалу.
function changeLvl(k){
  const s=st.plan.segs[st.cur];if(!s.id||!lvlCount(s.id)||k===getLvl(s.id))return;
  setLvl(s.id,k);
  if(Pl.on)plStop();
  renderNow();
  let x=null;
  if(coActive()){x=co.iv[coPos().k];if(x.type!=='set')return;}
  else x=resolveEx(s,st.plan.d);
  setSub(x.sub);
  if(x.meter!==Mt.meter){setMeter(x.meter);if(Mt.on){metroStop();metroStart();}}
}

  const box=$('shareBox');
  const fallback=()=>{box.hidden=false;box.innerHTML='<textarea class="share" id="shareText" readonly></textarea>';$('shareText').value=text;$('shareText').select();toast(L('Выдели и скопируй текст','Select and copy the text'));};
  try{navigator.clipboard.writeText(text).then(()=>{box.hidden=true;toast(L('Тренировка скопирована','Workout copied'));},fallback);}catch(e){fallback();}
};

renderStatic();
setBpm(Mt.bpm);
rebuild();
window.__grif={buildSession,coachPlan,dayInfo,resolveEx,ALLOC,TIMES,EX,EXEN,GROUPS,renderTab,parseTab,TESTS,setLang,X,VX,getLvl,st,co};
})();
</script>
